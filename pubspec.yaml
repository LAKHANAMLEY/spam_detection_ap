name: spam_delection_app
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3

  # Google Sign-In for Firebase Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  http: ^1.2.2
  flutter_spinkit: ^5.1.0
  date_picker_plus: ^4.2.0
  flutter_bloc: ^9.1.0

  # intl_phone_field: any
  curved_navigation_bar: any
  equatable: any
  shared_preferences: ^2.3.3
  fast_contacts: ^4.0.0
  permission_handler: ^11.3.1
  # pricing_cards: ^0.0.8
  image_picker: ^1.1.2
  path_provider: ^2.0.11
  modal_progress_hud_nsn: ^0.5.1
  # call_log: ^4.0.0
  intl: ^0.19.0
  fluttertoast: ^8.2.8
  cached_network_image: ^3.4.1
  call_e_log: ^0.0.4
  # flutter_localization: ^0.2.2
  flutter_face_pile: ^0.0.3
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  direct_call_plus: ^1.0.4
  url_launcher: ^6.3.1
  phone_state: ^2.0.1
  system_alert_window: ^2.0.4
  phone_state_background: ^0.0.4
  firebase_crashlytics: ^4.2.0
  flutter_local_notifications: ^19.0.0
  firebase_analytics: ^11.3.6
  flutter_local_notifications_platform_interface: ^9.0.0
  flutter_contacts: ^1.1.9+2
  flutter_screenutil: ^5.9.3
  # flutter_sms_inbox: ^1.0.3
  sms_advanced: ^1.1.0
  flutter_native_splash: ^2.4.4
  styled_text: ^8.1.0
  sqflite: ^2.4.2
  phone_numbers_parser: ^9.0.3
  flutter_libphonenumber: ^2.5.1
  intl_phone_number_input: ^0.7.4
  # workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # intl_phone_number_input: ^0.7.0+2
  # country_picker: ^2.0.19
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

  package_rename: ^1.8.0
  flutter_logs: ^2.2.1

# flutter_native_splash-development.yaml
flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo_white_1024.png
  branding: assets/images/logo_white_1024.png
  color_dark: "#ffffff"
  image_dark: assets/images/logo_white_1024.png
  branding_dark: assets/images/logo_white_1024.png

  android_12:
    image: assets/images/logo_white_1024.png
    icon_background_color: "#ffffff"
    image_dark: assets/images/logo_white_1024.png
    icon_background_color_dark: "#666666"

  web: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo_white_1024.png"
  image_path_android: "assets/images/logo_white_1024.png"
  adaptive_icon_monochrome: "assets/images/logo_white_1024.png"
  adaptive_icon_foreground: "assets/images/logo_white_1024.png"
  adaptive_icon_background: "#ffffff"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo_white_1024.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/logo_white_1024.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo_white_1024.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Robooto
      fonts:
        - asset: assets\fonts\Roboto-Black.ttf
        - asset: assets\fonts\Roboto-BlackItalic.ttf
        - asset: assets\fonts\Roboto-Bold.ttf
        - asset: assets\fonts\Roboto-Italic.ttf
        - asset: assets\fonts\Roboto-Light.ttf
          weight: 700

flutter_intl:
  enabled: true
